<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Bar Chart — SAS VA Data-Driven Content</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  /* ════════════════════════════════════════════════════════════════
   *  SAS VA DDC MESSAGING SHIM
   *  Self-contained equivalent of util/messagingUtil.js so this file
   *  drops into VA as a single .html with no sibling JS dependencies.
   * ════════════════════════════════════════════════════════════════ */
  (function () {
    if (window.va && window.va.messagingUtil) return;
    window.va = window.va || {};
    var _cb = null;
    window.va.messagingUtil = {
      setOnDataReceivedCallback: function (fn) {
        _cb = fn;
        window.addEventListener('message', function (ev) {
          if (ev && ev.data && typeof ev.data === 'object' && _cb) _cb(ev.data);
        });
      },
      postMessage: function (msg) {
        if (window.parent) window.parent.postMessage(msg, '*');
      },
      postSelectionMessage: function (resultName, rows) {
        rows = (rows || []).map(function (r) { return (typeof r === 'object') ? r : { row: r }; });
        this.postMessage({ resultName: resultName, selections: rows });
      },
      postInstructionalMessage: function (resultName, txt) {
        this.postMessage({ resultName: resultName, message: txt });
      }
    };
  })();
</script>
<script>
  // Theme: honor ?theme=dark, else the shared dashboard preference
  (function () {
    try {
      var p = new URLSearchParams(location.search).get('theme');
      var t = p || localStorage.getItem('rta-dashboard-theme');
      if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    } catch (e) {}
  })();
</script>
<style>
  :root {
    --pearl-1: #f7f3ec;
    --pearl-3: #e8edf3;
    --glass:        rgba(255, 254, 251, 0.62);
    --hairline:     rgba(15, 23, 42, 0.07);
    --ink-1: #0a1628;
    --ink-3: #475569;
    --ink-4: #64748b;
    --ink-5: #94a3b8;
    --rta-red: #b91c2c;
    --gold:    #b8852e;
  }
  html[data-theme="dark"] {
    --pearl-1: #0a1220;
    --pearl-3: #0d1830;
    --glass:        rgba(16, 28, 50, 0.62);
    --hairline:     rgba(255, 255, 255, 0.08);
    --ink-1: #f4f7fb;
    --ink-3: rgba(255, 255, 255, 0.72);
    --ink-4: rgba(255, 255, 255, 0.55);
    --ink-5: rgba(255, 255, 255, 0.40);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Manrope', sans-serif;
    background:
      radial-gradient(circle at 20% 0%, var(--pearl-3) 0%, transparent 55%),
      var(--pearl-1);
    color: var(--ink-1);
    overflow: hidden;
  }

  .stage {
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: clamp(12px, 2.4vh, 28px) clamp(16px, 2.6vw, 36px);
  }

  .chart-head {
    flex: 0 0 auto;
    display: flex;
    align-items: baseline;
    gap: 14px;
    flex-wrap: wrap;
    padding-bottom: clamp(8px, 1.6vh, 16px);
    border-bottom: 1px solid var(--hairline);
  }
  .chart-eyebrow {
    width: 100%;
    font-size: clamp(9px, 1.1vh, 11px);
    font-weight: 800;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .chart-title {
    font-size: clamp(16px, 2.8vh, 26px);
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .chart-sub {
    font-size: clamp(11px, 1.6vh, 14px);
    font-weight: 600;
    color: var(--ink-4);
    font-feature-settings: 'tnum' 1;
  }
  .sample-badge {
    margin-left: auto;
    font-size: clamp(9px, 1.2vh, 11px);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--rta-red);
    border: 1px solid currentColor;
    border-radius: 999px;
    padding: 3px 10px;
    opacity: 0.85;
  }
  .sample-badge.hidden { display: none; }

  .chart-mount {
    flex: 1 1 auto;
    min-height: 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .chart-mount svg { width: 100%; height: 100%; }

  .empty-note {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-5);
    text-align: center;
    padding: 0 10%;
  }

  /* ─── 3D bar chart (same visual language as performance.html) ─── */
  .v3d-grid-line  { stroke: rgba(15, 23, 42, 0.07); stroke-width: 0.6; stroke-dasharray: 2 3; }
  .v3d-axis-label { fill: var(--ink-3); font-size: 13px; font-weight: 700; font-family: 'Manrope', sans-serif; letter-spacing: 0.08em; text-transform: uppercase; }
  .v3d-y-label    { fill: var(--ink-5); font-size: 11px; font-weight: 600; font-family: 'Manrope', sans-serif; font-feature-settings: 'tnum' 1; }
  .v3d-bar-total  { fill: var(--ink-1); font-size: 13px; font-weight: 800; font-family: 'Manrope', sans-serif; font-feature-settings: 'tnum' 1; }
  html[data-theme="dark"] .v3d-grid-line  { stroke: rgba(255, 255, 255, 0.08); }
  html[data-theme="dark"] .v3d-axis-label { fill: rgba(255, 255, 255, 0.95); }

  .v3d-bar-group { cursor: pointer; transition: filter 0.18s ease; }
  .v3d-bar-group:hover { filter: brightness(1.08) saturate(1.15); }
  .v3d-bar-group:hover .v3d-bar-total { fill: var(--rta-red); }
  html[data-theme="dark"] .v3d-bar-group:hover .v3d-bar-total { fill: #5cc6e8; }
  .v3d-hit { fill: transparent; }

  .v3d-stack-group {
    opacity: 0;
    transform: scaleY(0.6);
    animation: bar-in 0.7s cubic-bezier(0.34, 1.2, 0.64, 1) forwards;
  }
  @keyframes bar-in {
    to { opacity: 1; transform: scaleY(1); }
  }

  /* ─── Tooltip ─── */
  .v3d-tooltip {
    position: absolute;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s ease;
    background: var(--glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.16);
    padding: 10px 14px;
    min-width: 150px;
    z-index: 10;
  }
  .v3d-tooltip.visible { opacity: 1; }
  .v3d-tooltip-title {
    font-size: 12px;
    font-weight: 800;
    padding-bottom: 6px;
    margin-bottom: 6px;
    border-bottom: 1px solid var(--hairline);
  }
  .v3d-tooltip-row { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; color: var(--ink-3); }
  .v3d-tooltip-row + .v3d-tooltip-row { margin-top: 4px; }
  .v3d-tooltip-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  .v3d-tooltip-label { flex: 1; }
  .v3d-tooltip-val { font-weight: 800; color: var(--ink-1); font-feature-settings: 'tnum' 1; }
</style>
</head>
<body>
  <main class="stage">
    <header class="chart-head">
      <div class="chart-eyebrow">Data-Driven Content · 3D Bar</div>
      <h1 class="chart-title" id="chart-title">3D Bar Chart</h1>
      <div class="chart-sub" id="chart-sub"></div>
      <span class="sample-badge" id="sample-badge">Sample data · awaiting SAS VA</span>
    </header>
    <div class="chart-mount" id="chart-mount"></div>
  </main>

<script>
  'use strict';

  /* ════════════════════════════════════════════════════════════════
   *  STATE
   *  CHART_DATA — [{ label, key, value, rows }] aggregated by category
   *  rows holds the original VA row indices so bar clicks can post a
   *  selection back to the report (brushing other objects).
   * ════════════════════════════════════════════════════════════════ */
  let CHART_DATA   = [];
  let CAT_LABEL    = 'Category';
  let MEASURE_LABEL = 'Value';
  let ACTIVE_KEY   = '';
  let RESULT_NAME  = null;
  let IS_SAMPLE    = true;

  const MAX_BARS = 12;     // beyond this, smallest categories fold into "Other"
  const TEAL = ['#b5dfff', '#5cc6e8', '#2d80a8', '#1a4d66'];

  /* ════════════════════════════════════════════════════════════════
   *  SAS VA DDC DATA HANDLER
   *  Works with ANY two columns assigned in the Roles tab:
   *  one category (string/date) + one measure (numeric). Role order
   *  doesn't matter — the measure is detected by column type. Rows
   *  are aggregated (summed) per category. If no numeric column is
   *  assigned, categories are counted instead.
   * ════════════════════════════════════════════════════════════════ */
  function onVADataReceived(msg) {
    if (!msg || !Array.isArray(msg.data) || !Array.isArray(msg.columns)) return;
    RESULT_NAME = msg.resultName;

    if (msg.columns.length < 1) return;

    let measureIdx = msg.columns.findIndex(c => c && c.type === 'number');
    let catIdx = msg.columns.findIndex((c, i) => i !== measureIdx);
    if (catIdx === -1) catIdx = 0;   // single-column fallback

    const colName = i => (msg.columns[i] && (msg.columns[i].label || msg.columns[i].name)) || '';
    CAT_LABEL = colName(catIdx) || 'Category';
    MEASURE_LABEL = measureIdx !== -1 ? (colName(measureIdx) || 'Value') : 'Count';

    // Aggregate measure by category (sum), tracking source row indices
    const agg = new Map();
    msg.data.forEach((row, ri) => {
      const key = row[catIdx] == null || row[catIdx] === '' ? '(missing)' : String(row[catIdx]);
      let v = 1;
      if (measureIdx !== -1) {
        v = parseFloat(row[measureIdx]);
        if (isNaN(v)) v = 0;
      }
      if (!agg.has(key)) agg.set(key, { label: key, key: key, value: 0, rows: [] });
      const e = agg.get(key);
      e.value += v;
      e.rows.push(ri);
    });

    let items = [...agg.values()].sort((a, b) => b.value - a.value);

    // Fold the tail into "Other" so the chart stays readable
    if (items.length > MAX_BARS) {
      const head = items.slice(0, MAX_BARS - 1);
      const tail = items.slice(MAX_BARS - 1);
      head.push({
        label: 'Other',
        key: '__other__',
        value: tail.reduce((s, d) => s + d.value, 0),
        rows: tail.flatMap(d => d.rows)
      });
      items = head;
    }

    CHART_DATA = items;
    IS_SAMPLE = false;
    ACTIVE_KEY = '';
    document.getElementById('sample-badge').classList.add('hidden');
    render();
  }

  /* ════════════════════════════════════════════════════════════════
   *  SAMPLE DATA — shown when opened outside SAS VA, replaced the
   *  moment the first VA message arrives.
   * ════════════════════════════════════════════════════════════════ */
  function loadSampleData() {
    CAT_LABEL = 'Driver Category';
    MEASURE_LABEL = 'Violations';
    CHART_DATA = [
      { label: 'Taxi',     key: 'Taxi',     value: 1840, rows: [] },
      { label: 'Pub. Bus', key: 'Pub. Bus', value: 1265, rows: [] },
      { label: 'Limo',     key: 'Limo',     value: 940,  rows: [] },
      { label: 'School',   key: 'School',   value: 615,  rows: [] },
      { label: 'Marine',   key: 'Marine',   value: 410,  rows: [] },
      { label: 'Hourly',   key: 'Hourly',   value: 285,  rows: [] }
    ];
    render();
  }

  /* ════════════════════════════════════════════════════════════════
   *  HELPERS
   * ════════════════════════════════════════════════════════════════ */
  function fmt(v) {
    const a = Math.abs(v);
    if (a >= 1e6) return (v / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
    if (a >= 1e3) return (v / 1e3).toFixed(1).replace(/\.0$/, '') + 'k';
    if (a > 0 && a < 10 && v !== Math.round(v)) return v.toFixed(1);
    return Math.round(v).toLocaleString();
  }

  function niceCeil(v) {
    if (v <= 0) return 1;
    const exp = Math.floor(Math.log10(v));
    const f = v / Math.pow(10, exp);
    const nf = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10;
    return nf * Math.pow(10, exp);
  }

  function truncate(s, n) { return s.length > n ? s.slice(0, n - 1) + '…' : s; }

  function onBarClick(item, isActive) {
    ACTIVE_KEY = isActive ? '' : item.key;
    if (RESULT_NAME) {
      va.messagingUtil.postSelectionMessage(RESULT_NAME, ACTIVE_KEY ? item.rows : []);
    }
    render();
  }

  /* ════════════════════════════════════════════════════════════════
   *  3D BAR RENDERER — full-stage version of the chart in
   *  performance.html (front + side + top faces, sheen, shadow)
   * ════════════════════════════════════════════════════════════════ */
  function render() {
    const mount = document.getElementById('chart-mount');
    mount.innerHTML = '';

    document.getElementById('chart-title').textContent =
      MEASURE_LABEL + ' by ' + CAT_LABEL;

    if (!CHART_DATA.length) {
      document.getElementById('chart-sub').textContent = '';
      const note = document.createElement('div');
      note.className = 'empty-note';
      note.textContent = 'No data — assign one category and one measure in the SAS VA Roles tab.';
      mount.appendChild(note);
      return;
    }

    const grandTotal = CHART_DATA.reduce((s, d) => s + d.value, 0);
    document.getElementById('chart-sub').textContent =
      'Total ' + fmt(grandTotal) + ' · ' + CHART_DATA.length + ' categories';

    const VB = { w: 1000, h: 480 };
    const padL = 64, padR = 30, padT = 46, padB = 58;
    const chartW = VB.w - padL - padR;
    const chartH = VB.h - padT - padB;

    const n = CHART_DATA.length;
    const BAR_W = Math.max(26, Math.min(96, (chartW * 0.62) / n));
    const CAT_GAP = (chartW - n * BAR_W) / (n + 1);
    const ISO_X = Math.max(5, BAR_W * 0.16);
    const ISO_Y = Math.max(7, BAR_W * 0.20);

    const maxRaw = Math.max(...CHART_DATA.map(d => d.value), 0);
    const niceMax = niceCeil(maxRaw || 1);

    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('viewBox', `0 0 ${VB.w} ${VB.h}`);
    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

    const s = TEAL;
    svg.insertAdjacentHTML('beforeend', `<defs>
      <radialGradient id="catbar-shadow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#000000" stop-opacity="0.65"/>
        <stop offset="60%" stop-color="#000000" stop-opacity="0.22"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="catbar-sheen" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="catbar-front" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%"  stop-color="${s[0]}"/>
        <stop offset="55%" stop-color="${s[1]}"/>
        <stop offset="100%" stop-color="${s[2]}"/>
      </linearGradient>
      <linearGradient id="catbar-side" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%"  stop-color="${s[1]}"/>
        <stop offset="60%" stop-color="${s[2]}"/>
        <stop offset="100%" stop-color="${s[3]}"/>
      </linearGradient>
      <radialGradient id="catbar-top" cx="35%" cy="30%" r="80%">
        <stop offset="0%"  stop-color="${s[0]}"/>
        <stop offset="55%" stop-color="${s[1]}"/>
        <stop offset="100%" stop-color="${s[2]}"/>
      </radialGradient>
    </defs>`);

    // Grid + y-axis labels
    const gridSteps = 4;
    for (let i = 0; i <= gridSteps; i++) {
      const y = padT + chartH - (chartH * i / gridSteps);
      const line = document.createElementNS(svgNS, 'line');
      line.setAttribute('x1', padL); line.setAttribute('x2', padL + chartW);
      line.setAttribute('y1', y); line.setAttribute('y2', y);
      line.setAttribute('class', 'v3d-grid-line');
      svg.appendChild(line);
      const lbl = document.createElementNS(svgNS, 'text');
      lbl.setAttribute('x', padL - 8); lbl.setAttribute('y', y + 4);
      lbl.setAttribute('text-anchor', 'end'); lbl.setAttribute('class', 'v3d-y-label');
      lbl.textContent = fmt(niceMax * i / gridSteps);
      svg.appendChild(lbl);
    }

    const baseY = padT + chartH;
    const barXs = [];
    CHART_DATA.forEach((d, ci) => {
      const v = d.value;
      const barX = padL + CAT_GAP + ci * (BAR_W + CAT_GAP);
      barXs.push(barX);
      const barH = Math.max(0, (v / niceMax) * chartH);
      const barY = baseY - barH;

      const g = document.createElementNS(svgNS, 'g');
      g.setAttribute('class', 'v3d-stack-group v3d-bar-group');
      g.style.animationDelay = `${0.15 + ci * 0.06}s`;

      const isDimmed = ACTIVE_KEY && d.key !== ACTIVE_KEY;
      const isActive = ACTIVE_KEY && d.key === ACTIVE_KEY;
      if (isDimmed) g.setAttribute('opacity', '0.30');
      if (isActive) g.style.filter = `brightness(1.12) saturate(1.18) drop-shadow(0 0 6px ${s[1]})`;
      g.addEventListener('click', (ev) => {
        ev.stopPropagation();
        onBarClick(d, isActive);
      });

      const shadow = document.createElementNS(svgNS, 'ellipse');
      shadow.setAttribute('cx', barX + BAR_W / 2 + ISO_X / 2);
      shadow.setAttribute('cy', baseY + ISO_Y + 2);
      shadow.setAttribute('rx', BAR_W * 0.62);
      shadow.setAttribute('ry', ISO_Y * 0.70);
      shadow.setAttribute('fill', 'url(#catbar-shadow)');
      shadow.setAttribute('opacity', '0.5');
      g.appendChild(shadow);

      const sidePts = [
        [barX + BAR_W,         baseY],
        [barX + BAR_W + ISO_X, baseY - ISO_Y],
        [barX + BAR_W + ISO_X, barY - ISO_Y],
        [barX + BAR_W,         barY]
      ].map(p => p.join(',')).join(' ');
      const side = document.createElementNS(svgNS, 'polygon');
      side.setAttribute('points', sidePts);
      side.setAttribute('fill', 'url(#catbar-side)');
      side.setAttribute('stroke', s[3]);
      side.setAttribute('stroke-width', '0.3');
      side.setAttribute('stroke-opacity', '0.45');
      g.appendChild(side);

      const front = document.createElementNS(svgNS, 'rect');
      front.setAttribute('x', barX);
      front.setAttribute('y', barY);
      front.setAttribute('width', BAR_W);
      front.setAttribute('height', barH);
      front.setAttribute('fill', 'url(#catbar-front)');
      front.setAttribute('stroke', s[2]);
      front.setAttribute('stroke-width', '0.3');
      front.setAttribute('stroke-opacity', '0.4');
      g.appendChild(front);

      const sheen = document.createElementNS(svgNS, 'rect');
      sheen.setAttribute('x', barX);
      sheen.setAttribute('y', barY);
      sheen.setAttribute('width', Math.max(2, BAR_W * 0.05));
      sheen.setAttribute('height', barH);
      sheen.setAttribute('fill', 'url(#catbar-sheen)');
      sheen.setAttribute('opacity', '0.6');
      g.appendChild(sheen);

      const topPts = [
        [barX,                 barY],
        [barX + BAR_W,         barY],
        [barX + BAR_W + ISO_X, barY - ISO_Y],
        [barX + ISO_X,         barY - ISO_Y]
      ].map(p => p.join(',')).join(' ');
      const top = document.createElementNS(svgNS, 'polygon');
      top.setAttribute('points', topPts);
      top.setAttribute('fill', 'url(#catbar-top)');
      top.setAttribute('stroke', s[2]);
      top.setAttribute('stroke-width', '0.3');
      top.setAttribute('stroke-opacity', '0.45');
      g.appendChild(top);

      const valLbl = document.createElementNS(svgNS, 'text');
      valLbl.setAttribute('x', barX + BAR_W / 2 + ISO_X / 2);
      valLbl.setAttribute('y', barY - ISO_Y - 8);
      valLbl.setAttribute('text-anchor', 'middle');
      valLbl.setAttribute('class', 'v3d-bar-total');
      valLbl.textContent = fmt(v);
      g.appendChild(valLbl);

      const hit = document.createElementNS(svgNS, 'rect');
      hit.setAttribute('class', 'v3d-hit');
      hit.setAttribute('x', barX - CAT_GAP / 2);
      hit.setAttribute('y', padT);
      hit.setAttribute('width', BAR_W + CAT_GAP);
      hit.setAttribute('height', chartH + ISO_Y + 6);
      hit.dataset.idx = ci;
      g.appendChild(hit);

      svg.appendChild(g);

      const lbl = document.createElementNS(svgNS, 'text');
      lbl.setAttribute('x', barX + BAR_W / 2 + ISO_X / 2);
      lbl.setAttribute('y', baseY + ISO_Y + 24);
      lbl.setAttribute('text-anchor', 'middle');
      lbl.setAttribute('class', 'v3d-axis-label');
      lbl.textContent = truncate(d.label, Math.max(6, Math.round(BAR_W / 7)));
      svg.appendChild(lbl);
    });

    // Tooltip
    const tooltip = document.createElement('div');
    tooltip.className = 'v3d-tooltip';
    mount.appendChild(tooltip);

    svg.querySelectorAll('.v3d-bar-group').forEach(group => {
      const hit = group.querySelector('.v3d-hit');
      if (!hit) return;
      const ci = parseInt(hit.dataset.idx, 10);
      group.addEventListener('mouseenter', () => {
        const d = CHART_DATA[ci];
        const pct = grandTotal > 0 ? ((d.value / grandTotal) * 100).toFixed(1) : '0.0';
        tooltip.innerHTML = `
          <div class="v3d-tooltip-title">${d.label}</div>
          <div class="v3d-tooltip-row">
            <span class="v3d-tooltip-dot" style="background:${s[2]}"></span>
            <span class="v3d-tooltip-label">${MEASURE_LABEL}</span>
            <span class="v3d-tooltip-val">${d.value.toLocaleString(undefined, { maximumFractionDigits: 2 })}</span>
          </div>
          <div class="v3d-tooltip-row">
            <span class="v3d-tooltip-dot" style="background:transparent;border:1px solid var(--ink-5)"></span>
            <span class="v3d-tooltip-label">Share of total</span>
            <span class="v3d-tooltip-val">${pct}%</span>
          </div>
        `;
        const rect = svg.getBoundingClientRect();
        const xCenter = barXs[ci] + BAR_W / 2;
        const tooltipX = (xCenter / VB.w) * rect.width;
        const isRight = ci > n / 2;
        tooltip.style.left = isRight ? `${tooltipX - 170}px` : `${tooltipX + 14}px`;
        tooltip.style.top = '8px';
        tooltip.classList.add('visible');
      });
      group.addEventListener('mouseleave', () => tooltip.classList.remove('visible'));
    });

    mount.appendChild(svg);
  }

  /* ════════════════════════════════════════════════════════════════
   *  BOOT
   * ════════════════════════════════════════════════════════════════ */
  va.messagingUtil.setOnDataReceivedCallback(onVADataReceived);
  loadSampleData();
  window.addEventListener('resize', () => { if (CHART_DATA.length) render(); });
</script>
