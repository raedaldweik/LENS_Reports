# Railway deployment configuration for the Dubai Police Smart Assistant.
# The Dockerfile lives in chatbot/ but builds from the repo root so the
# three datasets (TRF_DANGEROUS_JOIN_V3.csv, TRF_DRIVER_CID_CASES.csv,
# TRF_DRIVER_MOVEMENTS_V2.csv) are inside the build context.

[build]
builder = "DOCKERFILE"
dockerfilePath = "chatbot/Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Health check endpoint
healthcheckPath = "/api/health"
healthcheckTimeout = 300
