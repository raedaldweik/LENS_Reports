<title>Emerald Command Shell — Final Boss</title>
<style>
  :root{
    --bg:#000b0a;
    --deep:#00110f;
    --deep2:#001816;
    --emerald:#00f0ab;
    --mint:#bffff1;
    --teal:#29ffd4;
    --cyan:#18dfff;
    --line:rgba(77,255,207,.30);
  }
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg)}
  body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .stage{
    position:relative;
    width:100vw;
    height:100vh;
    min-height:560px;
    overflow:hidden;
    isolation:isolate;
    background:
      radial-gradient(ellipse at 50% 48%, rgba(0,255,184,.078) 0 16%, rgba(0,255,184,.036) 25%, transparent 58%),
      radial-gradient(circle at 12% 84%, rgba(0,255,184,.08), transparent 28%),
      radial-gradient(circle at 88% 18%, rgba(24,223,255,.08), transparent 26%),
      linear-gradient(180deg,#001311 0%,#000d0c 58%,#000808 100%);
  }
  .stage::before{
    content:"";
    position:absolute;inset:0;pointer-events:none;z-index:0;
    background:
      linear-gradient(117deg,transparent 0 42%,rgba(255,255,255,.02) 42.2% 46.5%,transparent 46.9%),
      linear-gradient(122deg,transparent 0 50%,rgba(255,255,255,.014) 50.2% 52.8%,transparent 53.1%),
      radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.42) 100%);
  }
  .art{position:absolute;inset:0;width:100%;height:100%;z-index:1;display:block}
  .dashboard-slot{
    position:absolute;
    z-index:3;
    left:8.1%;
    right:8.1%;
    top:9.35%;
    bottom:9.1%;
    overflow:hidden;
    pointer-events:auto;
  }
  .dashboard-slot::before{
    content:"";
    position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(180deg,rgba(255,255,255,.01),transparent 9%,transparent 91%,rgba(0,255,184,.018)),
      radial-gradient(circle at 50% 48%,rgba(0,255,184,.038),transparent 55%);
    mix-blend-mode:screen;
  }
  #dashboard-content{position:absolute;inset:0}
  @media(max-aspect-ratio:4/3){
    .dashboard-slot{left:6.8%;right:6.8%;top:8.3%;bottom:8.25%}
  }
</style>
</head>
